<html>
    <head>
        <style>
            body{
                margin: 0px;
                background-color: black;
                color: white;
            }
            header{
                background-color: pink;
                padding: 20px;
                top: 0;
                left: 0;
                right: 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            a{
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <p></p>
        <header>
            <h1>hello</h1>
            <p>paragraph</p>
            <div>
                <a href="">link</a>
                <a href="">link</a>
                <a href="">link</a>
            </div>
        <p id="weekend"></p>
        </header>
            
        <script>
            let day;
            let date = new Date().getDay();
            switch(date){
                case 0:
                    day = "Sunday";
                    break;
                case 1:
                    day = "Monday";
                    break;
                case 2:
                    day = "Tuesday";
                    break;
                case 3:
                    day = "Wednesday";
                    break;
                case 4:
                    day = "Thursday";
                    break;
                case 5:
                    day = "Friday Movie Night!";
                    break;
                case 6:
                    day = "Thursday";

            }
            document.getElementById('weekend').innerHTML= ""+day;
           
        </script>
    </body>
</html>
